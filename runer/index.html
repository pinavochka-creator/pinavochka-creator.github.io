<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Neo-Kyoto Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none; /* Запрет зума и скролла браузера */
            -webkit-tap-highlight-color: transparent;
        }
        body {
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .ui-element {
            pointer-events: auto;
            background: rgba(5, 5, 16, 0.85);
            border: 1px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px 30px;
            backdrop-filter: blur(8px);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }
        p {
            font-size: 1rem;
            color: #cccccc;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #ff00ff, #aa00aa);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 0, 255, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(255, 0, 255, 0.4);
        }
        #score-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            z-index: 5;
            pointer-events: none;
        }
        #error-message {
            display: none;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 20;
            font-size: 0.9rem;
            text-align: center;
            max-width: 90%;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="error-message"></div>
    <div id="score-hud" class="hidden">SCORE: <span id="score-value">0</span></div>

    <div id="menu-screen" class="ui-layer">
        <div class="ui-element">
            <h1>Neo-Kyoto</h1>
            <p>Свайп влево/вправо: смена полосы<br>Свайп вверх или тап: прыжок</p>
            <button class="btn" id="start-btn">Начать забег</button>
        </div>
    </div>

    <div id="gameover-screen" class="ui-layer hidden">
        <div class="ui-element">
            <h1>Сбой системы</h1>
            <p>Финальный счет: <span id="final-score">0</span></p>
            <button class="btn" id="restart-btn">Перезапуск</button>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ==========================================
        // 1. INPUT MANAGER
        // ==========================================
        class InputManager {
            constructor() {
                this.touchStartX = 0;
                this.touchStartY = 0;
                this.touchStartTime = 0;
                this.onLeft = () => {};
                this.onRight = () => {};
                this.onJump = () => {};

                this.bindEvents();
            }

            bindEvents() {
                document.addEventListener('touchstart', (e) => {
                    this.touchStartX = e.changedTouches[0].screenX;
                    this.touchStartY = e.changedTouches[0].screenY;
                    this.touchStartTime = Date.now();
                }, { passive: false });

                document.addEventListener('touchend', (e) => {
                    const touchEndX = e.changedTouches[0].screenX;
                    const touchEndY = e.changedTouches[0].screenY;
                    const deltaTime = Date.now() - this.touchStartTime;
                    
                    const dx = touchEndX - this.touchStartX;
                    const dy = touchEndY - this.touchStartY;

                    // Тап: минимальное движение и короткое время
                    if (Math.abs(dx) < 30 && Math.abs(dy) < 30 && deltaTime < 200) {
                        this.onJump();
                        return;
                    }

                    // Свайп
                    if (Math.abs(dx) > Math.abs(dy)) {
                        // Горизонтальный
                        if (Math.abs(dx) > 50) {
                            if (dx > 0) this.onRight();
                            else this.onLeft();
                        }
                    } else {
                        // Вертикальный
                        if (dy < -50) { // Свайп вверх
                            this.onJump();
                        }
                    }
                }, { passive: false });

                // Fallback для ПК (стрелки и пробел)
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'ArrowLeft') this.onLeft();
                    if (e.code === 'ArrowRight') this.onRight();
                    if (e.code === 'Space' || e.code === 'ArrowUp') this.onJump();
                });
            }
        }

        // ==========================================
        // 2. OBJECT POOL (Для оптимизации GC)
        // ==========================================
        class ObjectPool {
            constructor(createFn, initialSize = 20) {
                this.createFn = createFn;
                this.pool = [];
                this.active = [];
                for (let i = 0; i < initialSize; i++) {
                    this.pool.push(this.createFn());
                }
            }

            get() {
                let obj = this.pool.length > 0 ? this.pool.pop() : this.createFn();
                obj.visible = true;
                this.active.push(obj);
                return obj;
            }

            release(obj) {
                obj.visible = false;
                const index = this.active.indexOf(obj);
                if (index > -1) this.active.splice(index, 1);
                this.pool.push(obj);
            }

            releaseAll() {
                while (this.active.length > 0) {
                    this.release(this.active[0]);
                }
            }

            disposeAll() {
                this.releaseAll();
                this.pool.forEach(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                        else obj.material.dispose();
                    }
                });
                this.pool = [];
            }
        }

        // ==========================================
        // 3. PLAYER
        // ==========================================
        class Player {
            constructor(scene) {
                this.scene = scene;
                this.lane = 0; // -1, 0, 1
                this.targetX = 0;
                this.y = 0;
                this.vy = 0;
                this.isJumping = false;
                this.speed = 10;
                this.model = null;
                this.fallbackMesh = null;
                this.radius = 0.5;
                
                this.loadModel();
            }

            loadModel() {
                const loader = new GLTFLoader();
                loader.load(
                    'player_game.glb',
                    (gltf) => {
                        this.model = gltf.scene;
                        this.model.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });
                        this.model.position.set(0, 0, 0);
                        this.scene.add(this.model);
                        console.log("Player model loaded successfully.");
                    },
                    undefined,
                    (error) => {
                        console.error("Failed to load player_game.glb:", error);
                        this.showError("Ошибка загрузки модели player_game.glb. Используется резервная модель.");
                        this.createFallbackModel();
                    }
                );
            }

            showError(msg) {
                const el = document.getElementById('error-message');
                el.textContent = msg;
                el.style.display = 'block';
                setTimeout(() => { el.style.display = 'none'; }, 5000);
            }

            createFallbackModel() {
                const group = new THREE.Group();
                
                // Тело
                const bodyGeo = new THREE.CapsuleGeometry(0.4, 1, 4, 8);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.8 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.9;
                group.add(body);

                // Неоновые полосы (emissive)
                const stripGeo = new THREE.BoxGeometry(0.42, 0.1, 0.42);
                const stripMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 2 });
                const strip = new THREE.Mesh(stripGeo, stripMat);
                strip.position.y = 1.0;
                group.add(strip);

                // Шлем
                const helmetGeo = new THREE.SphereGeometry(0.35, 16, 16);
                const helmetMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.2, metalness: 0.9 });
                const helmet = new THREE.Mesh(helmetGeo, helmetMat);
                helmet.position.y = 1.6;
                group.add(helmet);

                this.fallbackMesh = group;
                this.scene.add(this.fallbackMesh);
            }

            getMesh() {
                return this.model || this.fallbackMesh;
            }

            switchLane(direction) {
                this.lane = Math.max(-1, Math.min(1, this.lane + direction));
                this.targetX = this.lane * 2;
            }

            jump() {
                if (!this.isJumping) {
                    this.isJumping = true;
                    this.vy = 8; // Сила прыжка
                }
            }

            update(delta) {
                const mesh = this.getMesh();
                if (!mesh) return;

                // Плавное перемещение по X (Lerp)
                mesh.position.x += (this.targetX - mesh.position.x) * 10 * delta;

                // Физика прыжка
                if (this.isJumping) {
                    this.y += this.vy * delta;
                    this.vy -= 25 * delta; // Гравитация

                    if (this.y <= 0) {
                        this.y = 0;
                        this.isJumping = false;
                        this.vy = 0;
                    }
                }

                mesh.position.y = this.y;
                
                // Небольшой наклон при движении для динамики
                mesh.rotation.z = (mesh.position.x - this.targetX) * -0.1;
                mesh.rotation.x = this.isJumping ? -0.2 : 0;
            }

            reset() {
                this.lane = 0;
                this.targetX = 0;
                this.y = 0;
                this.vy = 0;
                this.isJumping = false;
                const mesh = this.getMesh();
                if (mesh) {
                    mesh.position.set(0, 0, 0);
                    mesh.rotation.set(0, 0, 0);
                }
            }

            dispose() {
                const mesh = this.getMesh();
                if (mesh) {
                    mesh.traverse((child) => {
                        if (child.isMesh) {
                            if (child.geometry) child.geometry.dispose();
                            if (child.material) {
                                if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                                else child.material.dispose();
                            }
                        }
                    });
                    this.scene.remove(mesh);
                }
            }
        }

        // ==========================================
        // 4. WORLD GENERATOR
        // ==========================================
        class WorldGenerator {
            constructor(scene) {
                this.scene = scene;
                this.chunkLength = 20;
                this.viewDistance = 120; // Дальность прорисовки
                this.lastChunkZ = 0;
                this.chunks = [];
                this.gameSpeed = 15;
                
                // Материалы (переиспользуемые)
                this.roadMat = new THREE.MeshStandardMaterial({ 
                    color: 0x0a0a12, 
                    roughness: 0.05, 
                    metalness: 0.9 
                });
                
                this.neonLineMat = new THREE.MeshBasicMaterial({ color: 0xff00ff });
                
                this.holoMat = new THREE.MeshBasicMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.6,
                    blending: THREE.AdditiveBlending,
                    side: THREE.DoubleSide
                });

                this.buildingMat = new THREE.MeshStandardMaterial({ 
                    color: 0x050510, 
                    emissive: 0x110022,
                    emissiveIntensity: 0.5
                });

                // Пулы
                this.obstaclePool = new ObjectPool(() => this.createObstacleMesh(), 30);
                this.decoPool = new ObjectPool(() => this.createDecoMesh(), 20);
                this.buildingPool = new ObjectPool(() => this.createBuildingMesh(), 15);
            }

            createObstacleMesh() {
                const group = new THREE.Group();
                // Типы: 0 = низкий (прыжок), 1 = высокий (подкат/уклон), 2 = стена (уклон)
                const type = Math.floor(Math.random() * 3);
                let mesh;
                
                if (type === 0) { // Низкий барьер
                    const geo = new THREE.BoxGeometry(1.8, 0.8, 0.5);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0x550000 });
                    mesh = new THREE.Mesh(geo, mat);
                    mesh.position.y = 0.4;
                    mesh.userData = { type: 'low', hitbox: { y: 0.8, w: 1.8 } };
                } else if (type === 1) { // Высокий барьер (нужно присесть или уклониться, здесь сделаем уклонение для простоты или прыжок если высокий)
                    // Сделаем "ворота", через которые можно пропрыгнуть, но лучше просто уклоняться
                    const geo = new THREE.BoxGeometry(1.8, 2.5, 0.5);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x553300 });
                    mesh = new THREE.Mesh(geo, mat);
                    mesh.position.y = 1.25;
                    mesh.userData = { type: 'high', hitbox: { y: 2.5, w: 1.8 } };
                } else { // Стена (полная)
                    const geo = new THREE.BoxGeometry(1.8, 4, 1);
                    const mat = new THREE.MeshStandardMaterial({ color: 0x3333ff, emissive: 0x000055 });
                    mesh = new THREE.Mesh(geo, mat);
                    mesh.position.y = 2;
                    mesh.userData = { type: 'wall', hitbox: { y: 4, w: 1.8 } };
                }
                
                group.add(mesh);
                group.userData = { isObstacle: true, mesh: mesh, lane: 0 };
                return group;
            }

            createDecoMesh() {
                // Голографический карп/дракон (абстрактный)
                const group = new THREE.Group();
                const geo = new THREE.ConeGeometry(0.5, 3, 4);
                const mesh = new THREE.Mesh(geo, this.holoMat);
                mesh.rotation.x = Math.PI / 2;
                group.add(mesh);
                group.userData = { isDeco: true, speed: 2 + Math.random() * 3, offset: Math.random() * 100 };
                return group;
            }

            createBuildingMesh() {
                const group = new THREE.Group();
                const isPagoda = Math.random() > 0.7;
                
                if (isPagoda) {
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(2, 3, 8, 4), this.buildingMat);
                    base.position.y = 4;
                    const roof = new THREE.Mesh(new THREE.ConeGeometry(4, 2, 4), new THREE.MeshStandardMaterial({color: 0x220000}));
                    roof.position.y = 9;
                    group.add(base, roof);
                } else {
                    const h = 15 + Math.random() * 20;
                    const building = new THREE.Mesh(new THREE.BoxGeometry(6, h, 6), this.buildingMat);
                    building.position.y = h / 2;
                    group.add(building);
                }
                return group;
            }

            spawnChunk() {
                const zStart = this.lastChunkZ;
                const zEnd = zStart + this.chunkLength;
                this.lastChunkZ = zEnd;

                // 1. Дорога
                const roadGeo = new THREE.PlaneGeometry(8, this.chunkLength);
                const road = new THREE.Mesh(roadGeo, this.roadMat);
                road.rotation.x = -Math.PI / 2;
                road.position.set(0, 0, zStart + this.chunkLength / 2);
                road.receiveShadow = true;
                this.scene.add(road);

                // Неоновая линия по центру
                const lineGeo = new THREE.PlaneGeometry(0.2, this.chunkLength);
                const line = new THREE.Mesh(lineGeo, this.neonLineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(0, 0.01, zStart + this.chunkLength / 2);
                this.scene.add(line);

                // 2. Препятствия (шанс 40% на полосу)
                const lanes = [-1, 0, 1];
                lanes.forEach(lane => {
                    if (Math.random() < 0.4 && zStart > 20) { // Не спавнить сразу на старте
                        const obs = this.obstaclePool.get();
                        obs.position.set(lane * 2, 0, zStart + 5 + Math.random() * 10);
                        obs.userData.lane = lane;
                        obs.userData.mesh.position.x = 0; // Сброс локальной позиции
                        this.scene.add(obs);
                    }
                });

                // 3. Декорации (голограммы по бокам)
                if (Math.random() < 0.5) {
                    const deco = this.decoPool.get();
                    const side = Math.random() > 0.5 ? 1 : -1;
                    deco.position.set(side * (6 + Math.random() * 4), 3 + Math.random() * 2, zStart + 10);
                    this.scene.add(deco);
                }

                // 4. Здания на фоне
                if (Math.random() < 0.6) {
                    const bldg = this.buildingPool.get();
                    const side = Math.random() > 0.5 ? 1 : -1;
                    bldg.position.set(side * (15 + Math.random() * 10), 0, zStart + 10);
                    bldg.rotation.y = Math.random() * 0.5 - 0.25;
                    this.scene.add(bldg);
                }

                this.chunks.push({ zStart, zEnd, road, line });
            }

            update(delta, playerZ) {
                // Спавн новых чанков
                while (this.lastChunkZ < playerZ + this.viewDistance) {
                    this.spawnChunk();
                }

                // Удаление старых чанков и объектов
                for (let i = this.chunks.length - 1; i >= 0; i--) {
                    const chunk = this.chunks[i];
                    if (chunk.zEnd < playerZ - 10) {
                        // Очистка геометрии дороги
                        chunk.road.geometry.dispose();
                        chunk.line.geometry.dispose();
                        this.scene.remove(chunk.road);
                        this.scene.remove(chunk.line);
                        this.chunks.splice(i, 1);
                    }
                }

                // Обновление пулов
                this.updatePool(this.obstaclePool, playerZ);
                this.updatePool(this.decoPool, playerZ, delta);
                this.updatePool(this.buildingPool, playerZ);
            }

            updatePool(pool, playerZ, delta = 0) {
                for (let i = pool.active.length - 1; i >= 0; i--) {
                    const obj = pool.active[i];
                    if (obj.position.z < playerZ - 10) {
                        pool.release(obj);
                        this.scene.remove(obj);
                    } else {
                        // Анимация деко
                        if (obj.userData.isDeco) {
                            obj.position.z -= obj.userData.speed * delta;
                            obj.rotation.y += 2 * delta;
                            obj.position.y += Math.sin(Date.now() * 0.003 + obj.userData.offset) * 0.02;
                        }
                    }
                }
            }

            checkCollisions(player) {
                const pLane = player.lane;
                const pZ = player.getMesh() ? player.getMesh().position.z : 0;
                const pY = player.y;

                for (const obs of this.obstaclePool.active) {
                    if (obs.userData.lane === pLane) {
                        const zDiff = Math.abs(obs.position.z - pZ);
                        if (zDiff < 0.8) { // Столкновение по Z
                            const type = obs.userData.mesh.userData.type;
                            if (type === 'low' && pY > 0.8) {
                                continue; // Успешный прыжок
                            }
                            return true; // Столкновение
                        }
                    }
                }
                return false;
            }

            reset() {
                // Очистка чанков
                this.chunks.forEach(c => {
                    c.road.geometry.dispose();
                    c.line.geometry.dispose();
                    this.scene.remove(c.road);
                    this.scene.remove(c.line);
                });
                this.chunks = [];
                this.lastChunkZ = 0;

                // Очистка пулов
                this.obstaclePool.releaseAll();
                this.decoPool.releaseAll();
                this.buildingPool.releaseAll();
                
                // Удаление из сцены
                [...this.obstaclePool.active, ...this.decoPool.active, ...this.buildingPool.active].forEach(obj => {
                    this.scene.remove(obj);
                });
                this.obstaclePool.active = [];
                this.decoPool.active = [];
                this.buildingPool.active = [];
            }

            dispose() {
                this.reset();
                this.obstaclePool.disposeAll();
                this.decoPool.disposeAll();
                this.buildingPool.disposeAll();
                this.roadMat.dispose();
                this.neonLineMat.dispose();
                this.holoMat.dispose();
                this.buildingMat.dispose();
            }
        }

        // ==========================================
        // 5. UI MANAGER
        // ==========================================
        class UIManager {
            constructor() {
                this.menuScreen = document.getElementById('menu-screen');
                this.gameoverScreen = document.getElementById('gameover-screen');
                this.scoreHud = document.getElementById('score-hud');
                this.scoreValue = document.getElementById('score-value');
                this.finalScore = document.getElementById('final-score');
                
                this.onStart = () => {};
                this.onRestart = () => {};

                document.getElementById('start-btn').addEventListener('click', () => {
                    this.menuScreen.classList.add('hidden');
                    this.scoreHud.classList.remove('hidden');
                    this.onStart();
                });

                document.getElementById('restart-btn').addEventListener('click', () => {
                    this.gameoverScreen.classList.add('hidden');
                    this.onRestart();
                });
            }

            updateScore(score) {
                this.scoreValue.textContent = Math.floor(score);
            }

            showGameOver(score) {
                this.finalScore.textContent = Math.floor(score);
                this.gameoverScreen.classList.remove('hidden');
                this.scoreHud.classList.add('hidden');
            }

            reset() {
                this.updateScore(0);
                this.menuScreen.classList.remove('hidden');
                this.gameoverScreen.classList.add('hidden');
                this.scoreHud.classList.add('hidden');
            }
        }

        // ==========================================
        // 6. MAIN GAME CLASS
        // ==========================================
        class Game {
            constructor() {
                this.state = 'MENU'; // MENU, PLAYING, GAMEOVER
                this.score = 0;
                this.distance = 0;
                this.baseSpeed = 15;
                this.currentSpeed = this.baseSpeed;
                
                this.canvas = document.getElementById('game-canvas');
                this.clock = new THREE.Clock();
                
                this.initThree();
                this.initLighting();
                
                this.player = new Player(this.scene);
                this.world = new WorldGenerator(this.scene);
                this.ui = new UIManager();
                this.input = new InputManager();

                this.bindInput();
                this.bindResize();
                
                // Начальная генерация
                for(let i=0; i<3; i++) this.world.spawnChunk();
                
                this.animate = this.animate.bind(this);
                requestAnimationFrame(this.animate);
            }

            initThree() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x050510);
                this.scene.fog = new THREE.FogExp2(0x050510, 0.015);

                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
                this.camera.position.set(0, 3, 6);
                this.camera.lookAt(0, 1, -5);

                this.renderer = new THREE.WebGLRenderer({ 
                    canvas: this.canvas, 
                    antialias: true,
                    powerPreference: "high-performance"
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Оптимизация для мобильных
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            }

            initLighting() {
                const ambient = new THREE.AmbientLight(0x404060, 0.6);
                this.scene.add(ambient);

                const dirLight = new THREE.DirectionalLight(0xff00ff, 0.8);
                dirLight.position.set(5, 10, 5);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 1024;
                dirLight.shadow.mapSize.height = 1024;
                this.scene.add(dirLight);

                const cyanLight = new THREE.PointLight(0x00ffff, 1, 20);
                cyanLight.position.set(-5, 5, -5);
                this.scene.add(cyanLight);
            }

            bindInput() {
                this.input.onLeft = () => {
                    if (this.state === 'PLAYING') this.player.switchLane(-1);
                };
                this.input.onRight = () => {
                    if (this.state === 'PLAYING') this.player.switchLane(1);
                };
                this.input.onJump = () => {
                    if (this.state === 'PLAYING') this.player.jump();
                };

                this.ui.onStart = () => this.startGame();
                this.ui.onRestart = () => this.restartGame();
            }

            bindResize() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            startGame() {
                this.state = 'PLAYING';
                this.clock.start();
            }

            restartGame() {
                // 1. Полная очистка сцены от динамических объектов
                this.player.dispose();
                this.world.dispose();
                
                // 2. Пересоздание
                this.player = new Player(this.scene);
                this.world = new WorldGenerator(this.scene);
                
                // 3. Сброс переменных
                this.score = 0;
                this.distance = 0;
                this.currentSpeed = this.baseSpeed;
                this.state = 'PLAYING';
                
                // 4. Начальная генерация
                for(let i=0; i<3; i++) this.world.spawnChunk();
                
                this.ui.reset();
                this.clock.start();
            }

            animate() {
                requestAnimationFrame(this.animate);

                const delta = Math.min(this.clock.getDelta(), 0.1); // Защита от лагов

                if (this.state === 'PLAYING') {
                    // Прогрессия скорости
                    this.currentSpeed += delta * 0.1;
                    this.distance += this.currentSpeed * delta;
                    this.score = this.distance;

                    // Обновление игрока (движение вперед эмулируется движением мира назад, 
                    // но для простоты кода и коллизий будем двигать игрока вперед, а камеру за ним)
                    const mesh = this.player.getMesh();
                    if (mesh) {
                        mesh.position.z -= this.currentSpeed * delta;
                    }
                    
                    this.player.update(delta);
                    this.world.update(delta, mesh ? mesh.position.z : 0);

                    // Камера следует за игроком
                    if (mesh) {
                        this.camera.position.z = mesh.position.z + 6;
                        this.camera.position.x += (mesh.position.x * 0.3 - this.camera.position.x) * 5 * delta;
                    }

                    // Коллизии
                    if (this.world.checkCollisions(this.player)) {
                        this.state = 'GAMEOVER';
                        this.ui.showGameOver(this.score);
                    }

                    this.ui.updateScore(this.score);
                }

                this.renderer.render(this.scene, this.camera);
            }
        }

        // Запуск игры при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            window.game = new Game();
        });
    </script>
</body>
</html>
